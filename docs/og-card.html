<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 1200px 630px; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", "PingFang SC", sans-serif;
    background: #050b1c;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background:
      radial-gradient(900px 520px at 88% -10%, rgba(76, 141, 255, 0.55), transparent 62%),
      radial-gradient(760px 460px at -8% 108%, rgba(0, 214, 190, 0.30), transparent 60%),
      linear-gradient(122deg, #061029 0%, #071a48 46%, #03228d 100%);
  }
  /* 细网格纹理 */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(760px 520px at 30% 40%, #000 20%, transparent 78%);
    -webkit-mask-image: radial-gradient(760px 520px at 30% 40%, #000 20%, transparent 78%);
  }
  /* 斜向光带 */
  .beam {
    position: absolute; width: 1600px; height: 220px; left: -200px; top: 420px;
    background: linear-gradient(90deg, transparent, rgba(120, 180, 255, .16), transparent);
    transform: rotate(-14deg); filter: blur(6px);
  }
  .content { position: absolute; left: 76px; top: 88px; width: 700px; }

  .eyebrow { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
  .eyebrow .bar { width: 46px; height: 3px; border-radius: 2px;
    background: linear-gradient(90deg, #35e0c8, #6aa4ff); }
  .eyebrow span {
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 17px; letter-spacing: .22em; text-transform: uppercase;
    color: rgba(190, 214, 255, .92);
  }

  h1 { font-size: 82px; line-height: 1.02; letter-spacing: -2.2px; color: #fff; font-weight: 700; }
  h1 .cn { display: block; font-size: 44px; letter-spacing: 6px; font-weight: 500;
    color: rgba(255,255,255,.66); margin-top: 14px; }

  .rule { width: 132px; height: 2px; margin: 30px 0 26px;
    background: linear-gradient(90deg, rgba(255,255,255,.55), rgba(255,255,255,0)); }

  .role { font-size: 27px; color: #cfe0ff; font-weight: 600; letter-spacing: -.2px; }
  .role em { font-style: normal; color: #6fdccd; }

  .focus { margin-top: 12px; font-size: 23px; color: rgba(203, 219, 255, .78); font-weight: 400; }

  .tags { display: flex; gap: 12px; margin-top: 34px; flex-wrap: wrap; width: 660px; }
  .tag {
    font-size: 18px; color: #e8f1ff; padding: 9px 17px; border-radius: 999px;
    border: 1px solid rgba(160, 195, 255, .45);
    background: rgba(120, 165, 255, .12);
    backdrop-filter: blur(4px);
  }

  .avatar-wrap { position: absolute; right: 108px; top: 150px; width: 300px; height: 300px; }
  .avatar-ring {
    position: absolute; inset: -18px; border-radius: 50%;
    border: 1px solid rgba(150, 190, 255, .34);
  }
  .avatar-ring2 {
    position: absolute; inset: -44px; border-radius: 50%;
    border: 1px dashed rgba(150, 190, 255, .18);
  }
  .avatar {
    position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
    border: 4px solid rgba(255,255,255,.85);
    box-shadow: 0 30px 70px rgba(0, 20, 80, .55), 0 0 0 12px rgba(90, 140, 255, .10), inset 0 0 0 1px rgba(255,255,255,.2);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 16%; transform: scale(1.22); }

  .foot {
    position: absolute; left: 76px; bottom: 54px; display: flex; align-items: center; gap: 16px;
    font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 19px;
    color: rgba(190, 214, 255, .85); letter-spacing: .06em;
  }
  .foot .dot { width: 8px; height: 8px; border-radius: 50%; background: #35e0c8; }
  .badge {
    position: absolute; right: 96px; bottom: 50px; text-align: right;
    font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 15px;
    color: rgba(170, 198, 255, .62); letter-spacing: .18em; text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>
  <div class="beam"></div>

  <div class="content">
    <div class="eyebrow"><div class="bar"></div><span>Academic Homepage</span></div>
    <h1>Xiaolei Liu<span class="cn">刘小垒</span></h1>
    <div class="rule"></div>
    <div class="role">Founder &amp; CEO, <em>MAIVER</em></div>
    <div class="focus">AI Agent Security · Trustworthy AI</div>
    <div class="tags">
      <div class="tag">Agent Behavior Governance</div>
      <div class="tag">LLM Security</div>
      <div class="tag">Adversarial ML</div>
    </div>
  </div>

  <div class="avatar-wrap">
    <div class="avatar-ring2"></div>
    <div class="avatar-ring"></div>
    <div class="avatar"><img src="file:///Users/xiaolei/Dev/Homepage/images/photo.jpeg" alt=""></div>
  </div>

  <div class="foot"><span class="dot"></span>xlliu.org.cn</div>
  <div class="badge">Shanghai · China</div>
</div>
</body>
</html>
