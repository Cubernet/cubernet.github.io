<footer class="site-footer">
  <div class="site-footer__inner">
    <p class="site-footer__copyright">
      © {{ site.time | date: "%Y" }} {{ site.author.name }}
    </p>
    <div class="site-footer__meta">
      <span class="site-footer__updated">
        Last updated <time datetime="{{ site.time | date_to_xmlschema }}">{{ site.time | date: "%Y-%m-%d" }}</time>
      </span>
      <a class="site-footer__top" href="#about-me" aria-label="Back to top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
        <span>Top</span>
      </a>
    </div>
  </div>
</footer>
