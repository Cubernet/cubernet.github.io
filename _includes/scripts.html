

<script>
/*
  head 里的 base 标签设了 target=_blank，会让页面里所有链接都开新标签页，包括导航的页内锚点。
  这里只把「页内锚点」改回原地滚动，其余链接保持新标签页，并补上 rel 防护。
*/
(function () {
  document.addEventListener('click', function (event) {
    var link = event.target && event.target.closest ? event.target.closest('a[href]') : null;
    if (!link) return;

    var href = link.getAttribute('href') || '';

    // 纯锚点（#news）或站内根路径锚点（/#-news）
    var sameDocument =
      href.charAt(0) === '#' ||
      (href.indexOf('/#') === 0 && link.pathname === window.location.pathname);

    if (sameDocument) {
      link.target = '_self';
      return;
    }

    if (!link.rel) {
      link.rel = 'noopener noreferrer';
    }
  }, true);
})();
</script>

<script>
/* 暗色模式切换 */
(function () {
  var root = document.documentElement;
  var btn = document.getElementById('theme-toggle');
  if (!btn) return;

  function isDark() {
    return root.getAttribute('data-theme') === 'dark';
  }

  function sync() {
    btn.setAttribute('aria-pressed', isDark() ? 'true' : 'false');
    btn.setAttribute('title', isDark() ? '切换到浅色模式' : '切换到深色模式');
  }

  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  btn.addEventListener('click', function () {
    var next = !isDark();
    if (next) root.setAttribute('data-theme', 'dark');
    else root.removeAttribute('data-theme');
    try {
      /* 切回与当前系统一致的主题时清除手动锁定，恢复跟随系统自动切换 */
      var systemDark = mq ? mq.matches : false;
      if (next === systemDark) localStorage.removeItem('theme');
      else localStorage.setItem('theme', next ? 'dark' : 'light');
    } catch (e) {}
    sync();
  });

  /* 用户没有手动锁定时，跟随系统设置变化 */
  if (mq) {
    var onChange = function (event) {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      if (saved) return;
      if (event.matches) root.setAttribute('data-theme', 'dark');
      else root.removeAttribute('data-theme');
      sync();
    };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  sync();
})();
</script>

<script>
/* 导航滚动高亮：滚动到哪个章节，顶部导航就把对应项标出来 */
(function () {
  var OFFSET = 140; // 吸顶导航的高度 + 一点余量

  var nav = document.getElementById('site-nav');
  var links = [].slice.call(document.querySelectorAll('.site-nav a[href*="#"]'));

  var sections = [];
  links.forEach(function (a) {
    var hash = (a.getAttribute('href') || '').split('#')[1];
    if (!hash) return;
    var el = document.getElementById(hash);
    if (!el) return;
    var entry = null;
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].el === el) { entry = sections[i]; break; }
    }
    if (!entry) {
      entry = { el: el, links: [] };
      sections.push(entry);
    }
    entry.links.push(a);
  });

  if (!sections.length) return;

  sections.forEach(function (s) {
    s.top = s.el.getBoundingClientRect().top + window.pageYOffset;
  });

  var current = null;
  var ticking = false;

  var masthead = document.querySelector('.masthead');
  var progress = document.getElementById('scroll-progress');

  function update() {
    ticking = false;

    if (masthead) {
      masthead.classList.toggle('is-scrolled', window.pageYOffset > 8);
    }
    if (progress) {
      var maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      var ratio = maxScroll > 0 ? Math.min(1, Math.max(0, window.pageYOffset / maxScroll)) : 0;
      progress.style.transform = 'scaleX(' + ratio.toFixed(4) + ')';
    }

    var y = window.pageYOffset + OFFSET;
    var active = sections[0];

    for (var i = 0; i < sections.length; i++) {
      if (sections[i].top <= y) active = sections[i];
    }

    // 滚到底部时，最后一段可能够不到 OFFSET，强制点亮它
    var atBottom = window.innerHeight + window.pageYOffset >= document.documentElement.scrollHeight - 4;
    if (atBottom) active = sections[sections.length - 1];

    if (active === current) return;

    sections.forEach(function (s) {
      s.links.forEach(function (a) { a.classList.remove('is-active'); });
    });
    active.links.forEach(function (a) { a.classList.add('is-active'); });
    current = active;

    // 手机端横向导航条自动将当前章节平滑滑入视野中央
    if (nav && nav.scrollWidth > nav.clientWidth && active.links[0]) {
      var target = active.links[0];
      var left = target.offsetLeft - (nav.clientWidth - target.offsetWidth) / 2;
      try {
        nav.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
      } catch (e) {
        nav.scrollLeft = Math.max(0, left);
      }
    }
  }

  function onScroll() {
    if (ticking) return;
    ticking = true;
    window.requestAnimationFrame(update);
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', function () {
    sections.forEach(function (s) {
      s.top = s.el.getBoundingClientRect().top + window.pageYOffset;
    });
    current = null;
    onScroll();
  });
  window.addEventListener('load', update);
  update();
})();
</script>

<script>
/* 论文按年份筛选：自动从每条论文开头的会议/期刊年份标签（如 ACMMM'26）解析年份 */
(function () {
  var bar = document.getElementById('pub-year-filter');
  if (!bar) return;

  var headings = [].slice.call(document.querySelectorAll('.page__content .publication-heading'));
  if (!headings.length) return;

  var groups = [];
  var allItems = [];
  var yearCounts = {};

  headings.forEach(function (heading) {
    var list = heading.nextElementSibling;
    while (list && list.tagName !== 'UL') {
      list = list.nextElementSibling;
    }
    if (!list) return;

    var items = [].slice.call(list.children).filter(function (el) {
      return el.tagName === 'LI';
    });

    items.forEach(function (li) {
      var code = li.querySelector('code');
      var text = code ? code.textContent : '';
      var match = /'(\d{2})\b/.exec(text);
      var year = match ? '20' + match[1] : 'Other';
      li.setAttribute('data-year', year);
      yearCounts[year] = (yearCounts[year] || 0) + 1;
      allItems.push(li);

      /* 1) 提取 [[Paper](...)] [[DOI](...)] 等可点击操作按钮，并自动配对应微图标 */
      var actionIcons = {
        paper: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="13" y2="17"></line></svg>',
        doi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>',
        code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>',
        slides: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>',
        video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>',
        website: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3.6 9h16.8M3.6 15h16.8M12 3a13 13 0 0 0 0 18M12 3a13 13 0 0 1 0 18"></path></svg>'
      };

      var links = [].slice.call(li.querySelectorAll('a[href]'));
      var actionLinks = [];
      links.forEach(function (a) {
        var prev = a.previousSibling;
        var next = a.nextSibling;
        if (
          prev && prev.nodeType === 3 && /\[\s*$/.test(prev.nodeValue) &&
          next && next.nodeType === 3 && /^\s*\]/.test(next.nodeValue)
        ) {
          prev.nodeValue = prev.nodeValue.replace(/\[\s*$/, '');
          next.nodeValue = next.nodeValue.replace(/^\s*\]/, '');
          a.classList.add('pub-action-link');
          var key = (a.textContent || '').trim().toLowerCase();
          var icon = actionIcons[key] || actionIcons.doi;
          a.innerHTML = icon + '<span>' + a.textContent.trim() + '</span>';
          actionLinks.push(a);
        }
      });

      /* 1.5) 自动生成 BibTeX 一键复制按钮（无需手工维护） */
      var isJournal = /journal/i.test(heading.textContent || '');
      var titleEl = li.querySelector('strong');
      var venueEl = li.querySelector('em');
      var bibTitle = titleEl ? titleEl.textContent.trim().replace(/\.$/, '') : '';
      var bibVenue = venueEl ? venueEl.textContent.trim() : '';

      var authorText = '';
      if (titleEl) {
        var cur = titleEl.nextSibling;
        while (cur && cur.tagName !== 'BR') cur = cur.nextSibling;
        if (cur && cur.tagName === 'BR') {
          cur = cur.nextSibling;
          var partsA = [];
          while (cur && cur.tagName !== 'BR') {
            partsA.push(cur.textContent || '');
            cur = cur.nextSibling;
          }
          authorText = partsA.join('').replace(/\s+/g, ' ').trim().replace(/\.$/, '');
        }
      }

      if (bibTitle) {
        var bibAuthors = authorText
          .replace(/,\s+and\s+/g, ' and ')
          .replace(/\s+and\s+/g, ' and ')
          .replace(/,\s*/g, ' and ')
          .replace(/，\s*/g, ' and ');
        var doiHref = '';
        for (var j = 0; j < actionLinks.length; j++) {
          var href = actionLinks[j].getAttribute('href') || '';
          if (/doi\.org\//i.test(href)) {
            doiHref = href.replace(/^https?:\/\/(dx\.)?doi\.org\//i, '');
            break;
          }
        }
        var keyAuthor = (bibAuthors.split(' and ')[0] || 'liu').trim().split(/\s+/).pop().toLowerCase().replace(/[^a-z0-9]/g, '') || 'liu';
        var keyWord = (bibTitle.split(/[\s:]+/)[0] || 'paper').toLowerCase().replace(/[^a-z0-9]/g, '') || 'paper';
        var citeKey = keyAuthor + year + keyWord;
        var entryType = isJournal ? 'article' : 'inproceedings';
        var venueField = isJournal ? 'journal' : 'booktitle';
        var bibLines = [
          '@' + entryType + '{' + citeKey + ',',
          '  title     = {' + bibTitle + '},',
          '  author    = {' + bibAuthors + '},',
          '  ' + venueField + ' = {' + bibVenue + '},',
          '  year      = {' + year + '}' + (doiHref ? ',' : '')
        ];
        if (doiHref) bibLines.push('  doi       = {' + doiHref + '}');
        bibLines.push('}');
        var bibText = bibLines.join('\n');

        var bibBtn = document.createElement('button');
        bibBtn.type = 'button';
        bibBtn.className = 'pub-action-link';
        bibBtn.setAttribute('aria-label', 'Copy BibTeX');
        bibBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"></path><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"></path></svg><span>BibTeX</span>';
        bibBtn.addEventListener('click', (function (btn, text) {
          return function () {
            var span = btn.querySelector('span');
            var done = function () {
              if (span) span.textContent = 'Copied ✓';
              btn.classList.add('is-copied');
              clearTimeout(btn._t);
              btn._t = setTimeout(function () {
                if (span) span.textContent = 'BibTeX';
                btn.classList.remove('is-copied');
              }, 2000);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).then(done, function () {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); } catch (e) {}
                document.body.removeChild(ta);
                done();
              });
            }
          };
        })(bibBtn, bibText));
        actionLinks.push(bibBtn);
      }

      /* 2) 提取 CCF / JCR / ESI 高被引 / Best Paper Award 到静态徽章 */
      var rankBadges = [];
      var awardBadges = [];
      var spans = [].slice.call(li.querySelectorAll('span[style*="#b3261e"]'));
      spans.forEach(function (sp) {
        var raw = (sp.textContent || '').trim();
        if (!raw) return;

        var prev = sp.previousSibling;
        var next = sp.nextSibling;
        if (prev && prev.nodeType === 3) {
          prev.nodeValue = prev.nodeValue.replace(/\(\s*$/, '');
        }
        if (next && next.nodeType === 3) {
          next.nodeValue = next.nodeValue.replace(/^\s*\)/, '');
        }

        var parts = raw.split(/\s*[,，]\s*/);
        parts.forEach(function (part) {
          var label = part.trim();
          if (!label) return;
          var badge = document.createElement('span');
          if (/best\s+.*paper\s+award/i.test(label)) {
            badge.className = 'pub-award-badge';
            badge.textContent = label.indexOf('🏆') === -1 ? '🏆 ' + label : label;
            awardBadges.push(badge);
          } else if (/ESI|高被引/i.test(label)) {
            badge.className = 'pub-award-badge';
            badge.textContent = '★ ' + label;
            awardBadges.push(badge);
          } else {
            badge.className = 'pub-rank-badge';
            badge.textContent = label;
            rankBadges.push(badge);
          }
        });

        if (sp.parentNode) sp.parentNode.removeChild(sp);
      });

      var metaBadges = awardBadges.concat(rankBadges);

      if (actionLinks.length || metaBadges.length) {
        var row = document.createElement('div');
        row.className = 'pub-meta-row';
        actionLinks.forEach(function (a) { row.appendChild(a); });
        if (actionLinks.length && metaBadges.length) {
          var sep = document.createElement('span');
          sep.className = 'pub-meta-sep';
          sep.setAttribute('aria-hidden', 'true');
          row.appendChild(sep);
        }
        metaBadges.forEach(function (b) { row.appendChild(b); });

        while (li.lastChild && (
          (li.lastChild.nodeType === 3 && /^\s*$/.test(li.lastChild.nodeValue)) ||
          li.lastChild.tagName === 'BR'
        )) {
          li.removeChild(li.lastChild);
        }
        li.appendChild(row);
      }
    });

    groups.push({ heading: heading, list: list, items: items });
  });

  if (!allItems.length) return;

  var years = Object.keys(yearCounts).sort(function (a, b) {
    return b.localeCompare(a);
  });

  function makeBtn(label, value, count, active) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pub-filter__btn' + (active ? ' is-active' : '');
    btn.setAttribute('data-filter', value);
    btn.setAttribute('aria-pressed', active ? 'true' : 'false');
    btn.innerHTML = label + ' <span class="pub-filter__count">' + count + '</span>';
    return btn;
  }

  bar.appendChild(makeBtn('All', 'all', allItems.length, true));
  years.forEach(function (y) {
    bar.appendChild(makeBtn(y, y, yearCounts[y], false));
  });

  function applyFilter(selected) {
    groups.forEach(function (g) {
      var visibleCount = 0;
      var lastVisible = null;
      g.items.forEach(function (li) {
        li.classList.remove('is-last-visible');
        var show = selected === 'all' || li.getAttribute('data-year') === selected;
        li.style.display = show ? '' : 'none';
        if (show) {
          visibleCount++;
          lastVisible = li;
          li.classList.add('is-revealed');
        }
      });
      if (lastVisible) lastVisible.classList.add('is-last-visible');
      var showGroup = visibleCount > 0;
      g.heading.style.display = showGroup ? '' : 'none';
      g.list.style.display = showGroup ? '' : 'none';
      if (showGroup) g.heading.classList.add('is-revealed');
    });

    var buttons = bar.querySelectorAll('.pub-filter__btn');
    for (var i = 0; i < buttons.length; i++) {
      var isActive = buttons[i].getAttribute('data-filter') === selected;
      buttons[i].classList.toggle('is-active', isActive);
      buttons[i].setAttribute('aria-pressed', isActive ? 'true' : 'false');
    }
  }

  applyFilter('all');

  bar.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('.pub-filter__btn') : null;
    if (!btn) return;
    applyFilter(btn.getAttribute('data-filter'));
  });
})();
</script>

<script>
/* 防爬邮箱一键复制：点击时才在内存中拼接地址，HTML 源码无明文邮箱 */
(function () {
  var btns = document.querySelectorAll('.copy-email-btn');
  if (!btns.length) return;

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function () {
      var btn = this;
      var u = btn.getAttribute('data-u');
      var d = btn.getAttribute('data-d');
      if (!u || !d) return;
      var email = [u, d].join('@');

      var label = btn.querySelector('span');
      var done = function () {
        if (label) label.textContent = 'Copied ✓';
        else btn.textContent = 'Copied ✓';
        btn.classList.add('is-copied');
        clearTimeout(btn._copyTimer);
        btn._copyTimer = setTimeout(function () {
          if (label) label.textContent = 'Copy';
          else btn.textContent = 'Copy';
          btn.classList.remove('is-copied');
        }, 2000);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).then(done, function () {
          fallbackCopy(email);
          done();
        });
      } else {
        fallbackCopy(email);
        done();
      }
    });
  }
})();
</script>

<script>
/* 原生 Google Scholar 引用数与论文数加载：从 0 平滑滚动到真实值 + 同源优先 + 多 CDN 自动降级 + 全链路失效兜底 */
(function () {
  var badge = document.querySelector('.scholar-badge[data-stats-url]');
  if (!badge) return;
  var countEl = badge.querySelector('.scholar-badge__count');
  var primaryUrl = badge.getAttribute('data-stats-url');
  var repo = badge.getAttribute('data-gs-repo') || '';
  var fallbackNum = Number(badge.getAttribute('data-fallback') || 0);
  if (!countEl || !primaryUrl) return;

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var currentDisplayNum = 0;
  var animFrameId = null;

  function fetchWithTimeout(url, timeoutMs) {
    if (typeof AbortController === 'function') {
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, timeoutMs);
      return fetch(url, { signal: controller.signal }).then(function (res) {
        clearTimeout(timer);
        return res;
      }, function (err) {
        clearTimeout(timer);
        throw err;
      });
    }
    return fetch(url);
  }

  function fetchJsonWithFallback(urls) {
    var unique = [];
    for (var i = 0; i < urls.length; i++) {
      if (urls[i] && unique.indexOf(urls[i]) === -1) unique.push(urls[i]);
    }
    var idx = 0;
    function next() {
      if (idx >= unique.length) return Promise.resolve(null);
      var currentUrl = unique[idx++];
      return fetchWithTimeout(currentUrl, 4000)
        .then(function (res) { return res && res.ok ? res.json() : null; })
        .catch(function () { return null; })
        .then(function (data) { return data ? data : next(); });
    }
    return next();
  }

  function buildSources(fileName, fallbackUrl) {
    var list = ['/assets/data/' + fileName];
    if (repo) {
      list.push('https://fastly.jsdelivr.net/gh/' + repo + '@google-scholar-stats/' + fileName);
      list.push('https://cdn.jsdelivr.net/gh/' + repo + '@google-scholar-stats/' + fileName);
      list.push('https://raw.githubusercontent.com/' + repo + '/google-scholar-stats/' + fileName);
    }
    if (fallbackUrl) list.push(fallbackUrl);
    return list;
  }

  function setCitationText(text, ariaText) {
    countEl.textContent = text;
    countEl.hidden = false;
    badge.setAttribute('aria-label', 'Google Scholar citations: ' + (ariaText || text));
    var extra = document.querySelectorAll('[data-gs-citations]');
    for (var i = 0; i < extra.length; i++) {
      extra[i].textContent = text;
    }
  }

  function renderCitations(raw, suffix) {
    var suf = suffix || '';
    var target = Number(raw);
    if (isNaN(target) || !isFinite(target) || target <= 0) return;

    if (target === currentDisplayNum && !suf) return;

    if (animFrameId) {
      cancelAnimationFrame(animFrameId);
      animFrameId = null;
    }

    if (reduceMotion || !window.requestAnimationFrame) {
      currentDisplayNum = target;
      setCitationText(target.toLocaleString('en-US') + suf);
      return;
    }

    var startVal = currentDisplayNum;
    var diff = target - startVal;
    var duration = startVal === 0 ? 720 : 380;
    var startTime = null;

    function step(ts) {
      if (!startTime) startTime = ts;
      var elapsed = ts - startTime;
      var progress = Math.min(1, elapsed / duration);
      // easeOutCubic：起步干脆、收尾柔和
      var eased = 1 - Math.pow(1 - progress, 3);
      var val = Math.round(startVal + diff * eased);
      currentDisplayNum = val;
      setCitationText(val.toLocaleString('en-US') + (progress >= 1 ? suf : ''));
      if (progress < 1) {
        animFrameId = requestAnimationFrame(step);
      } else {
        animFrameId = null;
      }
    }

    animFrameId = requestAnimationFrame(step);
  }

  var hasRendered = false;
  try {
    var cached = sessionStorage.getItem('gs-citations');
    if (cached) {
      hasRendered = true;
      renderCitations(cached);
    }
  } catch (e) {}

  if (!window.fetch) {
    if (!hasRendered && fallbackNum > 0) renderCitations(fallbackNum, '+');
    return;
  }

  fetchJsonWithFallback(buildSources('gs_data_shieldsio.json', primaryUrl))
    .then(function (data) {
      var msg = data && data.message ? String(data.message).trim() : '';
      if (msg) {
        hasRendered = true;
        try { sessionStorage.setItem('gs-citations', msg); } catch (e) {}
        renderCitations(msg);
      } else if (!hasRendered && fallbackNum > 0) {
        // 全链路均失败时，平滑滚动到保底值（带 + 号），绝不停在 0
        renderCitations(fallbackNum, '+');
      }
    });

  /* 同步拉取 gs_data.json 统计 Google Scholar 总论文数，个位向下取整显示为 XX+ */
  var strip = document.querySelector('.highlights-strip[data-gs-full-url]');
  var paperEl = strip ? strip.querySelector('[data-gs-papers]') : null;
  var fullUrl = strip ? strip.getAttribute('data-gs-full-url') : '';
  if (paperEl && fullUrl) {
    var renderPapers = function (n) {
      var num = Number(n);
      if (isNaN(num) || num < 10) return;
      var floored = Math.floor(num / 10) * 10;
      paperEl.textContent = String(floored);
    };
    try {
      var cachedPapers = sessionStorage.getItem('gs-papers');
      if (cachedPapers) renderPapers(cachedPapers);
    } catch (e) {}
    fetchJsonWithFallback(buildSources('gs_data.json', fullUrl))
      .then(function (data) {
        if (!data || !data.publications) return;
        var count = Array.isArray(data.publications)
          ? data.publications.length
          : Object.keys(data.publications).length;
        if (!count) return;
        try { sessionStorage.setItem('gs-papers', String(count)); } catch (e) {}
        renderPapers(count);
      });
  }
})();
</script>

<script>
/* 左侧边栏 Visitor Map 等比缩放：保持第三方 300px 地图完整显示，不裁切不塌陷 */
(function () {
  var section = document.getElementById('map-section');
  if (!section) return;

  function fitMap() {
    var widget = section.querySelector('#mapmyvisitors-widget');
    if (!widget) return;

    var cs = window.getComputedStyle(section);
    var avail = section.clientWidth - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0);
    if (avail <= 0) return;

    var naturalW = widget.offsetWidth || 300;
    var naturalH = widget.offsetHeight || 0;
    var scale = Math.min(1, avail / naturalW);

    widget.style.transform = scale < 1 ? 'scale(' + scale.toFixed(4) + ')' : '';
    widget.style.marginBottom = (scale < 1 && naturalH > 0)
      ? (-Math.round(naturalH * (1 - scale))) + 'px'
      : '';
  }

  var mo = new MutationObserver(function () {
    if (section.querySelector('#mapmyvisitors-widget')) {
      fitMap();
      setTimeout(fitMap, 300);
      setTimeout(fitMap, 1200);
    }
  });
  mo.observe(section, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });

  if ('ResizeObserver' in window) {
    new ResizeObserver(fitMap).observe(section);
  }
  window.addEventListener('resize', fitMap);
  window.addEventListener('load', fitMap);
})();
</script>

<script>
/* 克制级滚动渐显（仅首次进入视口触发，支持系统减少动态效果设置） */
(function () {
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion || !('IntersectionObserver' in window)) return;

  var selectors = [
    '.highlights-strip .highlight-item',
    '.openings-callout',
    '.page__content .section-heading',
    '.page__content h2#news + ul > li',
    '.page__content .publication-heading',
    '.page__content .publication-heading + ul > li',
    '.page__content h2#honors-and-awards + ul > li',
    '.page__content h2#services + ul > li'
  ];

  var targets = [].slice.call(document.querySelectorAll(selectors.join(',')));
  if (!targets.length) return;

  document.documentElement.classList.add('reveal-ready');

  var vh = window.innerHeight || document.documentElement.clientHeight || 800;
  var highlightIdx = 0;

  targets.forEach(function (el) {
    el.classList.add('reveal-item');
    if (el.classList.contains('highlight-item')) {
      el.style.transitionDelay = (highlightIdx * 65) + 'ms';
      highlightIdx++;
    }
  });

  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      var el = entry.target;
      el.classList.add('is-revealed');
      observer.unobserve(el);
      if (el.style.transitionDelay) {
        setTimeout(function () { el.style.transitionDelay = ''; }, 700);
      }
    });
  }, {
    rootMargin: '0px 0px -28px 0px',
    threshold: 0.04
  });

  targets.forEach(function (el) {
    var rect = el.getBoundingClientRect();
    if (rect.top < vh * 0.96 && rect.bottom > 0) {
      // 首屏可见元素在下一帧顺滑入场
      requestAnimationFrame(function () {
        el.classList.add('is-revealed');
        if (el.style.transitionDelay) {
          setTimeout(function () { el.style.transitionDelay = ''; }, 700);
        }
      });
    } else {
      observer.observe(el);
    }
  });
})();
</script>

<script>
/* Earlier News 折叠块的平滑遮罩展开与收起 */
(function () {
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) return;

  var archives = document.querySelectorAll('details.news-archive');
  for (var i = 0; i < archives.length; i++) {
    (function (details) {
      var summary = details.querySelector('summary');
      var list = details.querySelector('ul');
      if (!summary || !list) return;
      var animating = false;

      summary.addEventListener('click', function (e) {
        e.preventDefault();
        if (animating) return;
        animating = true;

        if (!details.open) {
          details.open = true;
          var targetH = list.scrollHeight;
          list.style.maxHeight = '0px';
          list.style.opacity = '0';
          list.style.transform = 'translateY(-4px)';
          list.style.transition = 'max-height 0.36s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease, transform 0.32s cubic-bezier(0.22, 1, 0.36, 1)';
          void list.offsetHeight;
          list.style.maxHeight = targetH + 'px';
          list.style.opacity = '1';
          list.style.transform = 'translateY(0)';

          setTimeout(function () {
            list.style.maxHeight = '';
            list.style.opacity = '';
            list.style.transform = '';
            list.style.transition = '';
            animating = false;
          }, 380);
        } else {
          list.style.maxHeight = list.scrollHeight + 'px';
          list.style.opacity = '1';
          list.style.transform = 'translateY(0)';
          list.style.transition = 'max-height 0.26s ease, opacity 0.2s ease, transform 0.24s ease';
          void list.offsetHeight;
          list.style.maxHeight = '0px';
          list.style.opacity = '0';
          list.style.transform = 'translateY(-4px)';

          setTimeout(function () {
            details.open = false;
            list.style.maxHeight = '';
            list.style.opacity = '';
            list.style.transform = '';
            list.style.transition = '';
            animating = false;
          }, 270);
        }
      });
    })(archives[i]);
  }
})();
</script>
